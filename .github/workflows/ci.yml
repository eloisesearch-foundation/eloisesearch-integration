name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: make check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: make check

  reference:
    name: reference (${{ matrix.engine }})
    runs-on: ubuntu-latest
    needs: check
    strategy:
      fail-fast: false
      matrix:
        engine: [elasticsearch, opensearch]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: make reference-up REF=${{ matrix.engine }}
      - run: make reference-test REF=${{ matrix.engine }}
      - run: make reference-report
        if: always()
      - name: Summary
        if: always()
        run: test -f reports/summary.md && cat reports/summary.md >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reference-${{ matrix.engine }}
          path: reports/
          if-no-files-found: ignore
      - name: Engine logs on failure
        if: failure()
        run: docker compose -f compose.reference.yml logs --tail 200 ${{ matrix.engine }}
      - run: make reference-down REF=${{ matrix.engine }}
        if: always()
